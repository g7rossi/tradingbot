name: trading-bot

on:
  schedule:
    - cron: "40 12 * * 1-5"   # premarket, 8:40am EDT
    - cron: "40 13 * * 1-5"   # premarket, 8:40am EST
    - cron: "25 20 * * 1-5"   # recap, 4:25pm EDT
    - cron: "25 21 * * 1-5"   # recap, 4:25pm EST
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [premarket, recap]
        default: recap
      force:
        description: "Run even outside the normal time window"
        type: boolean
        default: true

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ inputs.force }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == 40* ]]; then
            echo "job=premarket" >> "$GITHUB_OUTPUT"
          else
            echo "job=recap" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          START_EQUITY: ${{ vars.START_EQUITY || '100000' }}
          IBS_SYMBOL: ${{ vars.IBS_SYMBOL || 'SSO' }}
          NOTIFY: ${{ vars.NOTIFY || 'console' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TEXT_TO_NUMBER: ${{ secrets.TEXT_TO_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ steps.pick.outputs.force }}
        run: python -m bot.main ${{ steps.pick.outputs.job }}
